                    frequency: at will
                  - spells:
                        - shield
                        - magic missile
                  - spells:
                        - darkness

        abilityScores:
            strength: 24
            dexterity: 12
            constitution: 22
            intelligence: 8
            wisdom: 14
            charisma: 10
        baseAttackBonus: 12
        baseAttackBonusDescription: +18 melee, +15 ranged
        cmb: 19
        cmbDescription: +23 grapple
        cmd: 30
        cmdDescription: 34 vs. trip
        feats:
            - Power Attack
            - Cleave
        skills:
            perception: 16
            intimidate: 10
            stealth: 4
        languages:
            - Common

        specialAbilities:
            - name: Big
              type: Ex
              description: The monster is very big and hard to miss.
        specialAttacks:
            - name: Roar
              type: Su
              description: The monster roars and scares everyone nearby.
        specialQualities:
            - name: Scary
              description: The monster is scary to look at.
        gear:
            - big club
            - shiny amulet
            - bag of rocks

        environment: cold mountains
        organization: solitary
        treasure: standard

    shadowdark:
        level: 8
        alignment: chaotic

        armorClass: 17
