name: Big Monster
description: An evil creature that lives near New City.
image: https://placehold.co/600x400
systems:
    dnd5e:
        size: large
        type: monster
        alignment: chaotic evil

        proficiency: 4
        challengeRating: "8"

        hp: "150 (12d10 + 84)"

        armorClass: 17
        armorClassDescription: natural armor

        speed: 30 ft., fly 60 ft.

        abilityScores:
            strength: 20
            dexterity: 12
            constitution: 18
            intelligence: 8
            wisdom: 14
            charisma: 10
        savingThrows:
            strength: p
            constitution: p
            wisdom: 6
        skills:
            perception: e
            athletics: p
            stealth: 2

        vulnerabilities:
            - fire
        resistances:
            - cold
        immunities:
            - poison
        conditionImmunities:
            - frightened
            - poisoned

        senses:
            - darkvision 60 ft.
            - passive Perception 16
        languages:
            - Common

        spellcasting:
            - kind: innate
              name: Innate Spellcasting
              ability: charisma
              description: The monster can cast a few spells without any material components.
              groups:
                  - each: false
                    spells:
                        - detect magic
                  - perDay: 2
                    each: false
                    spells:
                        - darkness
            - kind: leveled
              name: Spellcasting
              ability: intelligence
              description: The monster can also cast a couple of prepared spells.
              cantrips:
                  - mage hand
              levels:
                  - slots: 3
                    spells:
                        - shield

        traits:
            - name: Big
              description: The monster is very big and hard to miss.
            - name: Scary
              description: The monster is scary to look at.

        actions:
            - name: Multiattack
              description: The monster makes two attacks.
            - name: Claw
              description: One target. Hit does some damage.
            - name: Bite
              description: One target. Hit does some more damage.

        bonusActions:
            - name: Quick Step
              description: The monster moves a short distance.

        reactions:
            - name: Block
              description: The monster reduces some damage from an attack.

        legendaryActions:
            description:
                The monster can take a few legendary actions, choosing from the
                options below.
            actions:
                - name: Attack
                  cost: 1
                  description: The monster makes one attack.
                - name: Move
                  cost: 1
                  description: The monster moves without provoking attacks.
                - name: Roar
                  cost: 2
                  description: The monster roars and scares everyone nearby.

        lairActions:
            description:
                On initiative count 20, the monster can cause one of the
                following effects.
            actions:
                - description: Something bad happens to everyone nearby.
                - description: Something else bad happens instead.

    pathfinder1e:
        size: large
        type: monster
        subtypes:
            - evil
