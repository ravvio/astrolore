              damage: 1d8+5
              count: 2
            - name: bite
              bonus: 7
              range: close
              damage: 1d10+5
              count: 1
            - name: roar
              range: near
              count: 1

        traits:
            - name: Big
              description: The monster is very big and hard to miss.
            - name: Scary
              description: The monster is scary to look at.
